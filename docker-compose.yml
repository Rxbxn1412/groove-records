services:

  # Servidor de bases de datos PostgreSQL
  db:
    image: postgres:16
    container_name: tienda_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tienda}
      POSTGRES_USER: ${DB_USER:-tienda_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tienda_pass}
    volumes:
      # Datos persistentes
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta automáticamente la primera vez que arranca la base de datos
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de pruebas: captura los correos y los muestra en una web
  mailpit:
    image: axllent/mailpit:latest
    container_name: tienda_mail
    restart: unless-stopped
    ports:
      # Puerto de tu equipo configurable con MAIL_WEB_PORT (por defecto 8025)
      - "${MAIL_WEB_PORT:-8025}:8025"

  # pgAdmin: interfaz web para administrar PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tienda_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@grooverecords.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin1234}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # Puerto de tu equipo configurable con PGADMIN_PORT (por defecto 5050)
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      # Registra automáticamente el servidor "Groove Records DB"
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin

  # Aplicación Flask servida con Gunicorn
  web:
    build: .
    container_name: tienda_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      # Puerto de tu equipo configurable con WEB_PORT (por defecto 5000)
      - "${WEB_PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tienda}
      DB_USER: ${DB_USER:-tienda_user}
      DB_PASSWORD: ${DB_PASSWORD:-tienda_pass}
      MAIL_SERVER: ${MAIL_SERVER:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-pedidos@grooverecords.local}
      # El usuario que se registre con este correo será administrador de la tienda
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@grooverecords.com}

volumes:
  pgdata:
  pgadmin_data:
